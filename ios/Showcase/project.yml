name: Showcase
options:
  deploymentTarget: { iOS: "17.0" }
include:
  - ../WhitelabelKit/WhitelabelKit.yml
  - ../WhitelabelConsent/WhitelabelConsent.yml
  - ../WhitelabelFirebase/WhitelabelFirebase.yml
  - ../WhitelabelAds/WhitelabelAds.yml
configFiles:
  Debug: Config/Debug.generated.xcconfig
  Release: Config/Release.generated.xcconfig
settings:
  base:
    WL_GRADLE_ROOT: $(SRCROOT)/../..
    WL_SHARED_PROJECT: ":apps:showcase:shared"
    WL_SHARED_FRAMEWORKS: $(SRCROOT)/../../apps/showcase/shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
    SWIFT_VERSION: "5.9"
    # Kotlin builds iosSimulatorArm64 only (no Intel simulators): a Release build must not ask for x86_64.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
  configs:
    Debug: { WL_GRADLE_ARGS: -Pwhitelabel.mockApi=true }
    Release: { WL_GRADLE_ARGS: "" }
targets:
  Showcase:
    type: application
    platform: iOS
    # The Firebase and consent targets, their packages and the dSYM upload (WhitelabelFirebase.yml), and the
    # ads target with the ads keys in the built Info.plist (WhitelabelAds.yml).
    templates: [WhitelabelFirebaseApp, WhitelabelAdsApp]
    sources:
      - Showcase
      # The kit's screen labels: a static framework's resources ship through the app.
      - path: ../WhitelabelKit/Resources/WhitelabelKit.xcstrings
      # Gallery sample assets for the design-system catalog (-designCatalog, Debug).
      - path: ../WhitelabelKit/Resources/Preview/GalleryPreview.xcassets
      - path: ../WhitelabelKit/Resources/Preview/Fonts
        excludes: ["*.txt"]
    dependencies:
      - target: WhitelabelKit
    settings:
      base:
        INFOPLIST_FILE: Showcase/Info.plist
        # No iOS app icon yet (showcase's brand assets come later): don't ask the asset catalogs for one.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        PRODUCT_BUNDLE_IDENTIFIER: $(WL_BUNDLE_ID)
        PRODUCT_NAME: $(WL_APP_NAME)
        MARKETING_VERSION: $(WL_VERSION_NAME)
        CURRENT_PROJECT_VERSION: $(WL_VERSION_CODE)
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(WL_SHARED_FRAMEWORKS)
        # -ObjC: Firebase's Objective-C categories.
        OTHER_LDFLAGS: [$(inherited), -ObjC, -framework, Shared]
    preBuildScripts:
      - name: Sync the shared framework and its strings into the app
        basedOnDependencyAnalysis: false
        script: |
          cd "$WL_GRADLE_ROOT" && ./gradlew "$WL_SHARED_PROJECT:embedAndSignAppleFrameworkForXcode" $WL_GRADLE_ARGS
  WhitelabelKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../WhitelabelKit/Tests/WhitelabelKitTests
    dependencies:
      - target: Showcase
      - target: WhitelabelKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.whitelabel.kit.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/$(WL_APP_NAME).app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/$(WL_APP_NAME)
        BUNDLE_LOADER: $(TEST_HOST)
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(WL_SHARED_FRAMEWORKS)
  WhitelabelFirebaseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../WhitelabelFirebase/Tests/WhitelabelFirebaseTests
    # The kit and the Firebase targets (with their packages) live in the host app; a second copy here
    # would take the packages from the app.
    dependencies:
      - target: Showcase
      - target: WhitelabelKit
      - target: WhitelabelConsent
        link: false
      - target: WhitelabelFirebase
        link: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.whitelabel.firebase.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/$(WL_APP_NAME).app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/$(WL_APP_NAME)
        BUNDLE_LOADER: $(TEST_HOST)
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(WL_SHARED_FRAMEWORKS)
  WhitelabelAdsTests:
    # Not hosted (the tests don't need the app): the bundle links the ads target itself, with its
    # package and the SDK's binary, the kit, the consent target and Shared itself. Showcase's Shared
    # carries the Kotlin Crashlytics hook, so the Firebase target comes too. The tests touch no SDK state.
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../WhitelabelAds/Tests/WhitelabelAdsTests
    dependencies:
      - target: WhitelabelKit
      - target: WhitelabelConsent
      - target: WhitelabelFirebase
      - target: WhitelabelAds
      - framework: GoogleMobileAds.framework
        implicit: true
        embed: false
      - framework: GoogleAppMeasurement.framework
        implicit: true
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.whitelabel.ads.tests
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(WL_SHARED_FRAMEWORKS)
        OTHER_LDFLAGS: [$(inherited), -ObjC, -framework, Shared]
  ShowcaseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ShowcaseUITests]
    dependencies:
      - target: Showcase
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.whitelabel.showcase.uitests
        TEST_TARGET_NAME: Showcase
schemes:
  Showcase:
    build:
      targets:
        Showcase: all
    test:
      config: Debug
      targets:
        - WhitelabelKitTests
        - WhitelabelFirebaseTests
        - WhitelabelAdsTests
        - ShowcaseUITests
