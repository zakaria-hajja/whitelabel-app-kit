# Showcase: the reference app using every shared feature. Keys and rules: docs/creating-an-app.md.
api.tenant=acme
app.applicationId=com.whitelabel.showcase
app.name=Showcase
app.versionCode=1
app.versionName=1.0.0
app.deepLinkScheme=showcase
api.debug.baseUrl=http://10.0.2.2:3000/api/v1/
api.release.baseUrl=https://api.showcase.example/api/v1/
defaults.support.email=support@showcase.example
defaults.legal.privacyPolicyUrl=https://zakaria-hajja.github.io/whitelabel-app-kit/privacy/showcase/
defaults.legal.termsUrl=https://showcase.example/terms
defaults.features=catalog,profile
firebase.enabled=debug
# Test banner under Home in Debug only (Google's test units); Release has no ads SDK. Docs: docs/ads.md.
ads.enabled=debug
# AdMob app IDs: Google's consent SDK needs them (docs/firebase.md). Public, like every app's.
ads.android.appId=ca-app-pub-5645762821046301~8979907908
ads.ios.appId=ca-app-pub-5645762821046301~4593281191
