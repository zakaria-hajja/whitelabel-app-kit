name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: API contract is the vendored backend tag
        run: |
          scripts/test-openapi-scripts.sh
          scripts/check-openapi.sh

      - name: Unit tests and lint
        run: scripts/check.sh

      - name: Build every app (debug and unsigned release)
        run: ./gradlew assembleDebug assembleRelease

      - name: Verify apps (identity, isolation, distinct icons)
        run: scripts/verify-apps.sh

      - name: Release stays free of the mock backend, even with the flag on
        # -Pwhitelabel.mockApi=true must only ever reach debug builds; this checks the real wiring.
        run: |
          ./gradlew -Pwhitelabel.mockApi=true assembleRelease
          scripts/verify-apps.sh release

      - name: Standalone app fixture (an app repo with the foundation as a submodule)
        # Run from the fixture with app-relative paths, exactly as an app repo's CI does.
        working-directory: fixtures/standalone-app
        run: |
          ../../gradlew :app:assembleDebug
          ../../scripts/verify-apps.sh --apk app/build/outputs/apk/debug/app-debug.apk \
            --properties app/app.properties --type debug

      - name: Commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-commit-messages.sh "$BASE" "$HEAD"
