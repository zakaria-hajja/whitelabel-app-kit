name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled. Runs on main always finish, because only a finished main
  # run saves the Gradle cache that PRs restore.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Three jobs: `changes` decides whether Gradle is needed, then `tests` and `build` run in
# parallel. The `ci` job collects their results, so `ci` stays the single required check.
# Release builds (R8) run in release.yml: on main, and on a PR labelled `release-build`.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: What changed (a docs-only PR skips the Gradle jobs)
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          scripts/test-ci-needs-build.sh
          if [ "$EVENT" = pull_request ]; then build=$(scripts/ci-needs-build.sh "$BASE" "$HEAD"); else build=true; fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Gradle jobs needed: $build"

      - name: Commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-commit-messages.sh "$BASE" "$HEAD"

  tests:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: API contract is the vendored backend tag
        run: |
          scripts/test-openapi-scripts.sh
          scripts/check-openapi.sh

      - name: Unit tests and lint
        run: scripts/check.sh

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build every app (debug; release runs in release.yml)
        run: ./gradlew assembleDebug

      - name: Verify apps (identity, isolation, distinct icons)
        run: scripts/verify-apps.sh debug

      - name: Standalone app fixture (an app repo with the foundation as a submodule)
        # Run from the fixture with app-relative paths, exactly as an app repo's CI does.
        working-directory: fixtures/standalone-app
        run: |
          ../../gradlew :app:assembleDebug
          ../../scripts/verify-apps.sh --apk app/build/outputs/apk/debug/app-debug.apk \
            --properties app/app.properties --type debug

  ci:
    needs: [changes, tests, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed (skipped counts as passed on a docs-only PR)
        env:
          CHANGES: ${{ needs.changes.result }}
          TESTS: ${{ needs.tests.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "changes=$CHANGES tests=$TESTS build=$BUILD"
          [ "$CHANGES" = success ] || exit 1
          for r in "$TESTS" "$BUILD"; do
            case "$r" in success | skipped) ;; *) exit 1 ;; esac
          done
